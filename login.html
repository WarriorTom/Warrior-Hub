<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><title>Warrior Hub — Sign in</title>
<script>document.documentElement.dataset.theme="dark"</script>
<style>
:root{--bg:#f3f5fa;--card:#fff;--card2:#f5f7fc;--line:#e4e8f1;--line2:#cbd3e3;--text:#0f172a;--mute:#64748b;--faint:#94a3b8;--hover:#f1f4fb;
--accent:#047857;--accent2:#10B981;--accent-soft:#D1FAE5;--accent-text:#047857;--bad:#ef4444;--bad-text:#b91c1c;--ok:#16a34a;
--shadow:0 1px 2px rgba(15,23,42,.05),0 6px 20px rgba(15,23,42,.05);--shadow-lg:0 10px 30px rgba(16,185,129,.28)}
:root[data-theme="dark"]{--bg:#0b1020;--card:#131a2e;--card2:#192238;--line:#243049;--line2:#34436a;--text:#e8ecf8;--mute:#93a0bf;--faint:#66739a;--hover:#18213a;
--accent:#10B981;--accent2:#047857;--accent-soft:#064e3b;--accent-text:#6ee7b7;--bad:#f87171;--bad-text:#fca5a5;--ok:#34d399;
--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--shadow-lg:0 10px 30px rgba(16,185,129,.28)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
body{min-width:1100px}button{font-family:inherit}
.topline{position:fixed;top:0;left:0;right:0;height:4px;z-index:50;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.logo{width:44px;height:44px;border-radius:4px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;box-shadow:var(--shadow-lg);flex:none}

body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#1E2023 0%,#1E2023 46%,#ECEDEF 46%,#E2D4F8 100%)}
:root[data-theme="dark"] body{background:linear-gradient(160deg,#0b1020,#170f33)}
.box{width:400px;background:var(--card);border-radius:4px;box-shadow:0 24px 60px -20px rgba(0,0,0,.5);overflow:hidden;border:1px solid var(--line)}
.hd{padding:30px 32px 22px;text-align:center;border-bottom:1px solid var(--line)}
.hd .logo{margin:0 auto 14px;width:52px;height:52px;font-size:24px}
.hd small{display:block;font-size:11px;letter-spacing:.16em;font-weight:700;color:var(--accent-text)}
.hd h1{margin:4px 0 0;font-size:22px;letter-spacing:.02em;font-weight:800}
.hd p{margin:8px 0 0;font-size:12.5px;color:var(--mute)}
form{padding:24px 32px 26px}
label{display:block;font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--mute);margin:0 0 6px;text-transform:uppercase}
input{width:100%;height:42px;border:1px solid var(--line2);border-radius:4px;background:var(--card);color:var(--text);padding:0 12px;font:500 14px Inter,sans-serif;outline:none;margin-bottom:16px}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(16,185,129,.2)}
.go{width:100%;height:44px;border:0;border-radius:4px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:800;letter-spacing:.08em;font-size:12px;cursor:pointer;box-shadow:0 4px 14px rgba(16,185,129,.28)}
.go:disabled{opacity:.55;cursor:default}
.err{min-height:18px;margin:-4px 0 10px;font-size:12px;font-weight:600;color:var(--bad-text)}
.pw{position:relative}.pw input{padding-right:44px}.eye{position:absolute;right:4px;top:0;height:42px;width:40px;border:0;background:none;color:var(--mute);cursor:pointer;display:grid;place-items:center}.eye:hover,.eye.on{color:var(--accent-text)}
.fg{display:block;text-align:center;margin-top:14px;font-size:12px;font-weight:600;color:var(--accent-text);text-decoration:none}.fg:hover{text-decoration:underline}
.ft{padding:0 32px 22px;text-align:center;font-size:11px;color:var(--faint);line-height:1.5}
</style>

<style id="lgDeep">
:root[data-theme="dark"] body{background:linear-gradient(160deg,#03160d,#0a3f28 70%,#0e5336)}
:root[data-theme="dark"] .box{background:#0a2218;border:1px solid #1b5a3d;box-shadow:0 24px 60px -20px #000}
:root[data-theme="dark"] .hd{border-bottom:1px solid #1b5a3d}
:root[data-theme="dark"] .hd small{color:#6ee7b7}
:root[data-theme="dark"] input{background:#07190f;border-color:#1f6a47}
:root[data-theme="dark"] input:focus{border-color:#10B981;box-shadow:0 0 0 3px rgba(16,185,129,.2)}
:root[data-theme="dark"] .fg{color:#6ee7b7}
:root[data-theme="dark"] input{color:#6ee7b7;caret-color:#6ee7b7}
:root[data-theme="dark"] input:-webkit-autofill{-webkit-text-fill-color:#6ee7b7;caret-color:#6ee7b7;-webkit-box-shadow:0 0 0 1000px #07190f inset;transition:background-color 9999s}
</style>
<style>::selection{background:#10B981;color:#fff}</style><style>
:root[data-theme="dark"]{--text:#ecfdf5;--mute:#8fd4b3;--faint:#5fa584;--line2:#1f6a47}
:root[data-theme="dark"] label{color:#8fd4b3;opacity:1}
:root[data-theme="dark"] .hd p{color:#a7e3c6;opacity:1}
:root[data-theme="dark"] .ft{color:#6fb391}
:root[data-theme="dark"] .eye{color:#6ee7b7}
</style></head><body><div class="topline"></div>
<div class="box"><div class="hd"><div class="logo">W</div><small>WARRIOR LOGISTICS</small><h1 id="ttl">WARRIOR HUB SIGN IN</h1><p id="sub">Sign in with your work email to open Warrior Hub.</p></div>
<form id="f" autocomplete="on"><label for="u">Email</label><input id="u" type="email" autocomplete="username" autofocus>
<label for="p">Password</label><div class="pw"><input id="p" type="password" autocomplete="current-password"><button type="button" id="eye" class="eye" aria-label="Show password" title="Show password"><svg id="eyeI" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
<div class="err" id="err"></div><button class="go" id="go" type="submit">SIGN IN</button>
<a href="#" id="fg" class="fg">Forgot password?</a></form>
<div class="ft">Access is by invitation only. To get an account, ask Tom.</div></div>
<script type="module">
const $=i=>document.getElementById(i),SES='wl_session',TTL=14*24*3600*1000;
const CFG={apiKey:"AIzaSyCuLjPnex47FaoL0j7W8awVraVR6aZbeJ4",authDomain:"warrior-hub-e44a9.firebaseapp.com",projectId:"warrior-hub-e44a9",storageBucket:"warrior-hub-e44a9.firebasestorage.app",messagingSenderId:"942187494063",appId:"1:942187494063:web:981079cbd0fb173195b25a"};
function nextPage(){const n=new URLSearchParams(location.search).get('next')||'index.html';return /^[\w.-]+\.html$/.test(n)&&n!=='login.html'?n:'index.html'}
function pretty(em){return em.split('@')[0].split(/[._-]+/).filter(Boolean).map(w=>w[0].toUpperCase()+w.slice(1)).join(' ')}
function msg(e){const c=(e&&e.code)||'';if(/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c))return'Email or password is incorrect.';if(/too-many/.test(c))return'Too many attempts. Wait a few minutes or reset your password.';if(/network/.test(c))return'No connection. Check your internet and try again.';if(/permission/.test(c))return'Your account is not set up yet. Ask Tom to approve it.';return'Could not sign in ('+(c||'error')+').'}
$('eye').onclick=()=>{const p=$('p'),on=p.type==='password';p.type=on?'text':'password';$('eye').classList.toggle('on',on);$('eye').title=on?'Hide password':'Show password';$('eyeI').innerHTML=on?'<path d="M17.94 17.94A10.07 10.07 0 0112 19c-7 0-11-7-11-7a18.5 18.5 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 7 11 7a18.5 18.5 0 01-2.16 3.19M14.12 14.12a3 3 0 11-4.24-4.24"/><path d="M1 1l22 22"/>':'<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/>'};
let A,fb;
try{
const b='https://www.gstatic.com/firebasejs/10.12.2/';
const [ap,au,fs]=await Promise.all([import(b+'firebase-app.js'),import(b+'firebase-auth.js'),import(b+'firebase-firestore.js')]);
const app=ap.initializeApp(CFG),auth=au.getAuth(app),db=fs.getFirestore(app);A={au,auth};fb={fs,db};
await auth.authStateReady();
async function approve(user){const em=(user.email||'').toLowerCase();const d=await fs.getDoc(fs.doc(db,'allowed',em));
if(!d.exists()||d.data().ok===false){await au.signOut(auth);try{localStorage.removeItem(SES)}catch(e){}return null}
const nm=d.data().name||user.displayName||pretty(em);localStorage.setItem(SES,JSON.stringify({u:em,name:nm,exp:Date.now()+TTL}));return nm}
if(auth.currentUser){try{if(await approve(auth.currentUser))location.replace(nextPage())}catch(e){}}
$('f').onsubmit=async e=>{e.preventDefault();const err=$('err');err.textContent='';const u=$('u').value.trim(),p=$('p').value;if(!u||!p){err.textContent='Enter your email and password.';return}
$('go').disabled=true;
try{const cr=await au.signInWithEmailAndPassword(auth,u,p);const nm=await approve(cr.user);if(!nm){err.textContent='This account has not been approved for Warrior Hub. Ask Tom.';return}location.replace(nextPage())}
catch(x){err.textContent=msg(x)}finally{$('go').disabled=false}};
$('fg').onclick=async e=>{e.preventDefault();const err=$('err'),u=$('u').value.trim();if(!u){err.style.color='';err.textContent='Type your email above first, then click Forgot password.';return}
try{await au.sendPasswordResetEmail(auth,u)}catch(x){}
err.style.color='var(--ok)';err.textContent='If that email has an account, a reset link is on its way. Check your spam folder too.'}
}catch(x){console.error(x);$('err').textContent='Could not reach the sign-in service. Check your internet connection and reload.'}
</script></body></html>
