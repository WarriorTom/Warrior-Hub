<style>
:root{
  --bg:#f3f5fa; --card:#ffffff; --card2:#f5f7fc; --line:#e4e8f1; --line2:#cbd3e3;
  --text:#0f172a; --mute:#64748b; --faint:#94a3b8; --track:#e8ecf5; --hover:#f1f4fb;
  --accent:#7C3AED; --accent2:#A855F7; --accent-soft:#F1EAFF; --accent-text:#6D28D9; --on-accent:#ffffff;
  --ok:#16a34a; --ok-soft:#e7f7ec; --bad:#ef4444; --bad-soft:#fdecec; --bad-text:#b91c1c;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 6px 20px rgba(15,23,42,.05);
  --shadow-lg:0 10px 30px rgba(124,58,237,.28);
}
:root[data-theme="dark"]{
  --bg:#18181A; --card:#242526; --card2:#2D2E30; --line:#3D3E40; --line2:#595A5D;
  --text:#EFF0F1; --mute:#A7A8AB; --faint:#7E7F82; --track:#37383A; --hover:#2E2F31;
  --accent:#A855F7; --accent2:#7C3AED; --accent-soft:#2b1f4f; --accent-text:#C4B5FD; --on-accent:#ffffff;
  --ok:#34d399; --ok-soft:#10312a; --bad:#f87171; --bad-soft:#3b1a22; --bad-text:#fca5a5;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --shadow-lg:0 10px 30px rgba(168,85,247,.28);
}
html{scrollbar-gutter:stable;overflow-y:scroll}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
body{min-width:1100px}
button,input,select,textarea{font-family:inherit;font-size:inherit}
.topline{position:fixed;top:0;left:0;right:0;height:4px;z-index:950;pointer-events:none;background:linear-gradient(90deg,var(--accent),var(--accent2))}

/* ---------- page rail (same as the other pages) ---------- */
.wl-rail{position:fixed;left:0;top:0;bottom:0;width:76px;z-index:100;display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 0 16px;background:#1E2023;border-right:1px solid #494A4F}
.wl-rail .rl-logo{width:42px;height:42px;border-radius:4px;display:grid;place-items:center;margin-bottom:14px;background:linear-gradient(135deg,#7C3AED,#A855F7);color:#fff;font-weight:800;font-size:19px}
.wl-rail a,.wl-rail button{all:unset;cursor:pointer;box-sizing:border-box;width:64px;padding:9px 0 8px;border-radius:4px;display:flex;flex-direction:column;align-items:center;gap:5px;text-decoration:none;color:#B9BCC3;font-size:10px;font-weight:600;letter-spacing:.02em;text-align:center;line-height:1.15;transition:.15s}
.wl-rail a:hover,.wl-rail button:hover{background:rgba(255,255,255,.09);color:#fff}
.wl-rail a.on{background:linear-gradient(160deg,#7C3AED,#A855F7);color:#fff;box-shadow:0 8px 18px -8px rgba(124,58,237,.8)}
.wl-rail .rl-sp{flex:1}
.wl-rail .rl-logo,.rail .rl-logo{cursor:pointer;transition:.15s}.wl-rail .rl-logo:hover,.rail .rl-logo:hover{filter:brightness(1.12)}


/* ---------- left info panel (identical to Daily Tasks / Wave Plan) ---------- */
body{padding-left:448px}
.wp-side{position:fixed;left:76px;top:0;bottom:0;width:372px;z-index:90;overflow-y:auto;overflow-x:hidden;padding:30px 29px 28px;background:linear-gradient(180deg,#ECEDEF,#E2D4F8);border-right:2px solid #CDB8F0;scrollbar-width:thin}
:root[data-theme="dark"] .wp-side{background:radial-gradient(120% 60% at 50% 100%,color-mix(in srgb,var(--accent) 32%,transparent),transparent 70%),#1B1C1F;border-right:1px solid #33353A}
.wp-hero{position:relative;overflow:hidden;border-radius:4px;color:#fff;background:linear-gradient(160deg,#7C3AED 0%,#8F47F2 50%,#A855F7 100%);box-shadow:0 12px 24px -14px rgba(76,29,149,.7)}
.h4-c1,.h4-c2{position:absolute!important;border-radius:50%;pointer-events:none;z-index:0!important}
.h4-c1{right:-70px;top:40px;width:200px;height:200px;border:30px solid rgba(255,255,255,.10)}
.h4-c2{right:20px;bottom:-90px;width:150px;height:150px;background:rgba(255,255,255,.06)}
.wp-hero>*{position:relative;z-index:1}
.wp-top{background:#fff;color:#181819;padding:14px 16px 12px}
:root[data-theme="dark"] .wp-top{background:#292A2B;color:#EFF0F1}
:root[data-theme="dark"] .wp-sub{color:#A7A8AB;border-top-color:#414244}
.wp-brandrow{position:relative;display:flex;align-items:center;justify-content:center;min-height:42px}
.wp-logo{position:absolute;left:8px;top:0;width:42px;height:42px;border-radius:4px;display:grid;place-items:center;font-size:20px;font-weight:800;color:#fff;background:#7C3AED}
.wp-title{min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 52px}
.wp-title small{display:block;font-size:9px;font-weight:700;letter-spacing:.2em;color:#7C3AED;line-height:1;margin-bottom:4px}
.wp-title h1{margin:0;font-size:21px;font-weight:800;letter-spacing:.01em;line-height:1.05;color:inherit;text-transform:uppercase}
.wp-sub{margin-top:11px;padding-top:10px;border-top:1px solid #E5E5E6;text-align:center;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6E6E70}
.wp-body{padding:14px 16px 16px}
.wp-btn{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:12px 8px;border-radius:4px;background:#fff;color:#6D28D9;font-size:12px;font-weight:800;letter-spacing:.08em;box-shadow:0 4px 10px -6px rgba(23,18,31,.35)}
.wp-btn:hover{filter:brightness(.96)}
.wp-new{display:block;width:100%;margin-bottom:12px}
.wp-search{display:block;width:100%;box-sizing:border-box;margin-bottom:12px;padding:11px 12px;border-radius:4px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.18);color:#fff;font:inherit;font-size:12px;outline:none}
.wp-search::placeholder{color:rgba(255,255,255,.75)}
.wp-search:focus{background:rgba(255,255,255,.28);border-color:#fff;box-shadow:none}
.wp-chip:empty{display:none}
.wp-chip{display:inline-block;background:#fff;color:#7C3AED;font-size:10px;font-weight:800;letter-spacing:.14em;padding:5px 12px;border-radius:4px;margin:0 0 12px;text-transform:uppercase}
.wp-tags{display:flex;flex-direction:column;gap:6px}
.fl{font-size:10px;font-weight:800;letter-spacing:.16em;color:rgba(255,255,255,.85);margin:0 0 2px}
.frow{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:4px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.frow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow i{flex:none;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5)}
.frow b{flex:none;font-size:10px;background:rgba(255,255,255,.2);border-radius:4px;padding:2px 7px}
.frow:hover{border-color:#fff}
.frow.on{background:#fff;border-color:#fff;color:#6D28D9}.frow.on i{background:#7C3AED}.frow.on b{background:#F1EAFF}
.wp-tags .chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff}
.wp-tags .chip:hover{border-color:#fff}
.wp-tags .chip.on{background:#fff;border-color:#fff;color:#6D28D9}
.wp-sync{margin-top:14px;text-align:center}
.wp-sync .pill{display:block}
.pg{padding:30px 22px 40px}

/* ---------- page ---------- */
.pg{padding:30px 22px 40px;margin:0 auto}
.ph{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.ph .ic{width:46px;height:46px;border-radius:4px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.ph h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.01em}
.ph p{margin:3px 0 0;color:var(--mute);font-size:13px}
.ph .sp{flex:1}
.pill{font-size:11px;font-weight:600;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:8px 12px;white-space:nowrap}
.pill.ok{color:var(--ok)}
.btn{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:10px 14px;font-weight:600;font-size:13px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--hover);border-color:var(--line2)}
.btn.sm{padding:8px 10px;font-size:12px}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);border-color:transparent;box-shadow:0 4px 14px rgba(124,58,237,.28);font-weight:800;letter-spacing:.05em}
.btn.pri:hover{filter:brightness(1.07)}
.btn.bad{color:var(--bad-text)} .btn.bad:hover{background:var(--bad-soft);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.search{flex:0 0 280px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:4px;padding:10px 12px;outline:none}
.search:focus,.fld:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.16)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.rpanel{background:var(--card);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow)}
.rbar{position:sticky;top:0;z-index:60;background:var(--card);border-radius:4px 4px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0;padding:14px 22px;border-bottom:1px solid var(--line)}
.rpanel .grid{padding:24px 22px 26px;gap:22px}
.ddw{position:relative;display:inline-block}
.bt3{all:unset;cursor:pointer;box-sizing:border-box;padding:8px 12px;border-radius:4px;background:var(--card);border:1px solid var(--line);font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.bt3:hover{border-color:var(--accent)}.bt3.on{background:var(--accent);border-color:var(--accent);color:#fff}.bt3.clr{color:var(--accent-text);margin-left:2px}
.pop3{position:absolute;top:100%;left:0;margin-top:6px;background:var(--card);border:1px solid var(--line2,var(--line));border-radius:6px;box-shadow:0 14px 30px -10px rgba(23,18,63,.35);z-index:20;display:flex;flex-direction:column;max-height:70vh;overflow:auto;min-width:290px;overflow:hidden auto}
.fro{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:11px 14px;border-left:5px solid var(--c);border-bottom:1px solid var(--line);font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--text);background:var(--card)}
.fro:last-child{border-bottom:0}.fro:hover{background:color-mix(in srgb,var(--c) 7%,var(--card))}.fro span{flex:1}.fro b{font-size:10.5px;background:var(--track);border-radius:4px;padding:2px 7px;color:var(--mute)}
.fro.on{background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--c)}.fro.on b{background:var(--c);color:#fff}
.chip{all:unset;cursor:pointer;font-size:11px;font-weight:700;letter-spacing:.06em;padding:7px 11px;border-radius:4px;background:var(--card);border:1px solid var(--line);color:var(--mute);text-transform:uppercase}
.chip:hover{border-color:var(--line2)} .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.count{margin-left:auto;font-size:12px;color:var(--mute);font-weight:600}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:stretch}
.pc{position:relative;background:var(--card);border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);border-radius:4px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.pimg{all:unset;display:block;cursor:zoom-in;background:var(--card2);position:relative;border-bottom:1px solid var(--line)}
.pimg{aspect-ratio:3/4;overflow:hidden}
.pimg img{display:block;width:100%;height:100%;object-fit:contain;background:var(--card2)}
.ptag{position:absolute;left:8px;bottom:8px;background:var(--card)!important;box-shadow:0 2px 8px rgba(15,23,42,.2)}
.ph{padding:10px;border-bottom:1px solid var(--line)}
.pedit{position:absolute;top:50px;right:8px;width:30px;height:30px;padding:0;border-radius:4px;background:var(--card);box-shadow:0 2px 8px rgba(15,23,42,.25);color:var(--accent-text)}
.pb{padding:10px;display:flex;flex-direction:column;gap:7px}
.pt{display:flex;align-items:flex-start;justify-content:center;text-align:center;gap:10px}
.pt{min-height:0;width:100%}
.pt h3{flex:1;min-width:0}
.pt h3{width:100%;text-align:center;display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;margin:0;font-size:13.5px;font-weight:800;line-height:1.25;text-transform:uppercase;letter-spacing:.02em}
.tag{flex:none;font-size:8.5px;font-weight:800;letter-spacing:.08em;padding:3px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent-text);text-transform:uppercase}
.msg{margin:0;font-size:11.5px;line-height:1.4;color:var(--mute);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;background:var(--card2);border:1px solid var(--line);border-radius:4px;padding:6px 8px}

svg{display:block}

</style><style id="npcenter">:root:root #npPop.open,:root:root #modal .ov{padding:20px 20px 20px 96px!important}</style><style id="hfdark">:root:root:root[data-theme="dark"] .hf-form input,:root:root:root[data-theme="dark"] .hf-form select{background:rgba(0,0,0,.32)!important;border:1px solid rgba(255,255,255,.24)!important;color:#fff!important;color-scheme:dark}:root:root:root[data-theme="dark"] .hf-form input::placeholder{color:rgba(255,255,255,.55)!important}:root:root:root[data-theme="dark"] .hf-form input:focus,:root:root:root[data-theme="dark"] .hf-form select:focus{border-color:#fff!important;background:rgba(0,0,0,.45)!important}:root:root:root[data-theme="dark"] .hf-form option{background:#1b1d22;color:#fff}:root:root:root[data-theme="dark"] .hf-add,:root:root:root[data-theme="dark"] .hf-tog{background:rgba(0,0,0,.34)!important;color:#fff!important;border:1px solid rgba(255,255,255,.4)!important}:root:root:root[data-theme="dark"] .hf-add:hover,:root:root:root[data-theme="dark"] .hf-tog:hover{background:rgba(0,0,0,.5)!important;filter:none}</style><style id="wkpill">:root:root:root .mc3 .wkc.sm{position:absolute;top:8px;right:8px;margin:0;font-size:12px;padding:5px 10px;letter-spacing:.1em;border-radius:5px}</style><style id="statlbl">:root:root:root:root .hf-stats .ov:not(.on) b{color:color-mix(in srgb,var(--accent) 38%,#000)!important;font-weight:800}</style><style id="hflbl">:root:root:root:root .hf-title small,:root:root:root:root .hf-sub{color:color-mix(in srgb,var(--accent) 38%,#000)!important}</style></head>
<body>
<div class="topline"></div>
<nav class="wl-rail" id="wlRail" aria-label="Pages"></nav>

<aside class="wp-side" id="wpSide">
  <div class="wp-hero hf"><i class="h4-c1"></i><i class="h4-c2"></i>
    <div class="hf-head">
      <div class="hf-title"><small>WARRIOR LOGISTICS</small><h1>CALENDAR</h1></div>
      <div class="hf-sub">ALL BOOKINGS IN ONE PLACE</div>
      <button class="hf-tog" id="hfTog" type="button" aria-expanded="false" aria-controls="hfCol">＋ NEW BOOKING</button>
      <div class="hf-stats" id="hfStats"></div>
      <input class="wp-search" id="search" type="search" placeholder="Search bookings…">
    </div>
    <div class="hf-collapse" id="hfCol"><div class="hf-inner">
    <form class="hf-form" id="hfForm" autocomplete="off">
      <label class="hf f-title"><span>TITLE</span><input id="hfTitle" maxlength="120" placeholder="What's the booking?"></label>
      <label class="hf f-site"><span>SITE</span><select id="hfSite"></select></label>
      <label class="hf f-date"><span>DATE</span><input id="hfDate" type="date"></label>
      <label class="hf f-time"><span>TIME</span><input id="hfTime" type="time"></label>
      <label class="hf f-note"><span>NOTE</span><input id="hfNote" maxlength="500" placeholder="Add a note (shows on Day view and Daily Tasks)"></label>
      <label class="hf f-rep"><span>REPEAT</span><select id="hfRep"><option value="">One-off</option><option value="weekly">Every week</option></select></label>
      <button class="hf-add" id="hfAdd" type="submit">＋ ADD BOOKING</button>
    </form>
    </div></div>
  </div>
  <div class="sb-h">Sites</div><div class="sb-card" id="siteStats"></div>
  <div class="sb-h">Overview</div><div class="sb-card" id="stats"></div>
  <div class="wp-sync"><span class="pill" id="sync">Local only — add Firebase to share</span></div>
</aside>

<main class="pg">
  <section class="rpanel"><div class="rbar cbar" id="rbar"></div>
  <div class="cwrap" id="cal"></div></section>
</main>

<div id="modal"></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   CALENDAR — shows every booking from the Daily Tasks diary on one page.
   Same shared data: bookings/{id}: {id,title,date,time,site,repeat:''|'weekly',by,created,done:{date:{t,by}}}
   ===================================================================== */
const FIREBASE_CONFIG = window.WL_FB_CONFIG;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet=k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet=(k,v)=>{ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } };
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const addDays=(s,n)=>{ const d=parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const today=()=>ymd(new Date());
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmtLong=s=>{const d=parse(s),n=d.getDate(),x=(n%10===1&&n!==11)?'st':(n%10===2&&n!==12)?'nd':(n%10===3&&n!==13)?'rd':'th';return d.toLocaleDateString('en-GB',{weekday:'long'})+' '+n+x+' '+d.toLocaleDateString('en-GB',{month:'long'})+' '+d.getFullYear();};
const fmtShort=s=>parse(s).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const nowHM=()=>{ const d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); };
const minsOf=t=>{ const [h,m]=t.split(':').map(Number); return h*60+m; };
const initials=n=>{ const p=String(n||'').trim().split(/\s+/).filter(Boolean); if(!p.length) return ''; return ((p[0][0]||'')+((p.length>1?p[p.length-1][0]:p[0][1])||'')).toUpperCase(); };
const me=()=>window.WL_USER||lsGet('wl_name')||'';
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2600); }

const SITES=['DLS4','HSA7','DXFL','JOYL'];
const SITE_COL={DLS4:'#7C3AED',HSA7:'#0891B2',DXFL:'#EA580C',JOYL:'#16A34A','':'#64748B'};
const colOf=b=>SITE_COL[b.site]||SITE_COL[''];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const VIEWS=[['day','Day'],['week','Week'],['month','Month'],['agenda','Agenda']];

let bookings={};
let wkSel=null;
let view='week';   /* opens on Week view */
let cursor=today(), siteF='', q='', draft=null;
try{const _d=new URLSearchParams(location.search).get('date');if(/^\d{4}-\d{2}-\d{2}$/.test(_d||'')){cursor=_d;view='day';}}catch(e){}

/* ---------- storage: Firestore if configured, else this browser (shared with Daily Tasks) ---------- */
const LS_KEY='wl_daily_tasks_v2';
const store={
  mode:'local', fb:null,
  async init(){
    if(FIREBASE_CONFIG.apiKey && !window.WL_DEMO){
      try{
        const {fs,db}=await window.wlFirebase(); this.fb={fs,db}; this.mode='firebase';
        fs.onSnapshot(fs.collection(db,'bookings'),snap=>{ const o={}; snap.forEach(d=>{ o[d.id]=d.data(); }); bookings=o; renderAll(); },
          e=>{ console.error(e); toast('Sync error – check Firestore rules'); });
        return;
      }catch(e){ console.error(e); toast('Firebase failed – using local mode'); }
    }
    this.mode='local';
    try{ bookings=(JSON.parse(lsGet(LS_KEY)||'{}')).bookings||{}; }catch(e){ bookings={}; }
    if(window.WL_DEMO) seedDemo();
    renderAll();
  },
  persist(){ let o={}; try{ o=JSON.parse(lsGet(LS_KEY)||'{}')||{}; }catch(e){} o.bookings=bookings; lsSet(LS_KEY,JSON.stringify(o)); },
  async save(b){
    if(this.mode==='firebase'){ const {fs,db}=this.fb; try{ await fs.setDoc(fs.doc(db,'bookings',b.id),b); }catch(e){ console.error(e); toast('Could not save – check your connection'); } }
    else this.persist();
  },
  async del(id){
    if(this.mode==='firebase'){ const {fs,db}=this.fb; try{ await fs.deleteDoc(fs.doc(db,'bookings',id)); }catch(e){ console.error(e); toast('Could not delete – check your connection'); } }
    else this.persist();
  }
};
function seedDemo(){
  if(lsGet('wl_demo_seeded_cal')) return;
  const t=today(), nm=['Tom Jackson','Andy Hattersley','Jordan Arnold'];
  const S=[['Van collection - Fleet team','09:30','DLS4',0,''],['Safety walk with Amazon','14:00','HSA7',1,''],['Weekly new starter induction','10:00','',2,'weekly'],
   ['DVLA licence check batch','11:00','DLS4',3,''],['Halfords - collect vans','08:30','DXFL',4,''],['Driver 1-2-1s','13:30','JOYL',5,''],['MOT - VX21 ABC','09:00','DLS4',6,''],
   ['Amazon station audit','10:30','HSA7',8,''],['Team briefing','07:45','DLS4',-1,'weekly'],['Fuel card review','15:00','',9,''],['Recruitment open day','10:00','JOYL',11,''],
   ['Tyre change - 3 vans','08:00','DXFL',13,''],['Monthly safety meeting','14:30','',16,''],['Van inspection day','09:00','HSA7',-3,''],['New starter induction','09:30','DLS4',-5,'']];
  const NOTES={"Van collection - Fleet team": "Meet at the yard gate with both sets of van keys. The signed collection sheet must be photographed and posted in the managers chat before the van leaves site.", "Safety walk with Amazon": "Ask for the site manager on arrival. Hi-vis and safety boots required for everyone. Walk the full yard, the loading bays and the van wash area.", "Weekly new starter induction": "Welcome pack, handbook and uniform ready for each new starter. Cover the safety briefing first, then the app training and the ride-along schedule.", "DVLA licence check batch": "Batch of 12 drivers, licences must all be checked before Friday. Log every result on the tracker and flag any points or expiry dates within 60 days.", "Halfords - collect vans": "Collect three vans after servicing. Check the paperwork matches the invoice and walk round each van for damage before signing it out of the garage.", "Driver 1-2-1s": "Six drivers booked in, ten minutes each. Review last week scorecards, any concessions and safety events, and agree one focus point per driver.", "MOT - VX21 ABC": "Book in under VX21 ABC. Courtesy van arranged until 3pm, so remember to swap the fuel card and the keys back when the van is returned.", "Amazon station audit": "Audit starts at the main office. Have the fleet files, DVLA checks and training records printed and ready, plus the daily task reports for the last month.", "Team briefing": "Standing weekly briefing for the whole team. Cover last week results, the safety focus, rota changes and any new Amazon updates before the first wave.", "Fuel card review": "Check every fuel card balance and last month spend. Report any cards over budget or showing odd transactions to the finance team by end of day.", "Recruitment open day": "Open day for new driver applicants. Set up the interview room, print the application packs and have the induction dates ready to offer on the day.", "Tyre change - 3 vans": "Three vans booked in for new tyres. Drop them off before the first wave and arrange cover routes so no rounds are missed while they are out.", "Monthly safety meeting": "Review the month safety events, near misses and Netradyne data. Agree actions with owners and dates, and share the minutes in the managers chat.", "Van inspection day": "Full inspection of every van on site. Record tyres, lights, wipers and damage on the checklist, and report any defects straight to the fleet team.", "New starter induction": "Two new starters, first day on site. Shadow with an experienced driver, sign off the safety briefing and issue their uniform and handheld device."};
  S.forEach(([title,time,site,off,repeat],i)=>{ const id=uid('b'); bookings[id]={id,title,date:addDays(t,off),time,site,repeat,notes:NOTES[title]||'',by:nm[i%nm.length],created:new Date().toISOString(),done:off<0&&!repeat?{[addDays(t,off)]:{t:new Date().toISOString(),by:nm[0]}}:{}}; });
  store.persist(); lsSet('wl_demo_seeded_cal','1');
}

/* ---------- data helpers ---------- */
function occursOn(b,date){ return b.date===date || (b.repeat==='weekly' && b.date<date && parse(b.date).getDay()===parse(date).getDay()); }
function matches(b){
  if(siteF && b.site!==siteF) return false;
  const n=q.trim().toLowerCase(); if(!n) return true;
  return ((b.title||'')+' '+(b.site||'')+' '+(b.by||'')+' '+(b.notes||'')).toLowerCase().includes(n);
}
function bookingsFor(date){
  return Object.values(bookings).filter(b=>occursOn(b,date)&&matches(b))
    .sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99')||(a.created||'').localeCompare(b.created||''));
}
const isDone=(b,d)=>!!(b.done||{})[d];
function stateOf(b,d){
  if(d!==today()||!b.time||isDone(b,d)) return '';
  return minsOf(b.time)<minsOf(nowHM())?'over':'';
}
const mondayOf=s=>addDays(s,-parse(s).getDay()); /* Amazon weeks run Sunday to Saturday */
function amzWeek(s){ const d=parse(s), sun=addDays(s,-d.getDay()), sat=addDays(sun,6), y=parse(sat).getFullYear(), j1=new Date(y,0,1), w1=addDays(ymd(j1),-j1.getDay()); return {n:Math.round((parse(sun)-parse(w1))/604800000)+1,start:sun,end:sat}; }

/* ---------- rendering ---------- */
const IC={
 cal:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/>',
 pin:'<path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>',
 clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
 rep:'<path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
 alert:'<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>'
};
const svg=(k,s)=>`<svg width="${s||16}" height="${s||16}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${IC[k]}</svg>`;

function renderAll(){ const y=window.scrollY; renderSide(); renderBar(); renderMain(); window.scrollTo(0,y); }
function renderSide(){
  $('#sync').textContent=store.mode==='firebase'?'● Synced':(window.WL_DEMO?'Demo data':'Local only — add Firebase to share');
  $('#sync').className='pill'+(store.mode==='firebase'?' ok':'');
  const all=Object.values(bookings), t=today();
  const row=(lab,n,attr,on,ic)=>`<div class="sb-row${on?' on':''}" ${attr}><span class="sb-ic">${svg(ic)}</span><span class="sb-lb">${esc(lab)}</span><b class="sb-n">${n}</b></div>`;
  $('#siteStats').innerHTML=row('All sites',all.length,'data-site=""',!siteF,'pin')+SITES.map(s=>row(s,all.filter(b=>b.site===s).length,`data-site="${s}"`,siteF===s,'pin')).join('')+row('No site',all.filter(b=>!b.site).length,'data-site="-"',siteF==='-','pin');
  const m0=t.slice(0,7);
  let wk=0; for(let i=0;i<7;i++) wk+=bookingsFor(addDays(mondayOf(t),i)).length;
  let mo=0; const dim=new Date(parse(t).getFullYear(),parse(t).getMonth()+1,0).getDate(); for(let i=1;i<=dim;i++) mo+=bookingsFor(m0+'-'+pad(i)).length;
  const od=bookingsFor(t).filter(b=>stateOf(b,t)==='over').length;
  $('#stats').innerHTML=`<div class="sb-row" data-today="1" style="cursor:pointer"><span class="sb-ic">${svg('clock')}</span><span class="sb-lb">Today</span><b class="sb-n">${bookingsFor(t).length}</b></div>
   <div class="sb-row"><span class="sb-ic">${svg('cal')}</span><span class="sb-lb">This week</span><b class="sb-n">${wk}</b></div>
   <div class="sb-row"><span class="sb-ic">${svg('cal')}</span><span class="sb-lb">This month</span><b class="sb-n">${mo}</b></div>
   <div class="sb-row"><span class="sb-ic">${svg('rep')}</span><span class="sb-lb">Weekly repeats</span><b class="sb-n">${all.filter(b=>b.repeat==='weekly').length}</b></div>
   <div class="sb-row"><span class="sb-ic">${svg('alert')}</span><span class="sb-lb">Overdue today</span><b class="sb-n">${od}</b></div>`;
}
function titleText(){
  const d=parse(cursor);
  if(view==='month') return d.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  if(view==='week'){ const m=mondayOf(cursor), e=addDays(m,6); return fmtShort(m)+' – '+fmtShort(e)+' '+parse(e).getFullYear(); }
  if(view==='day') return fmtLong(cursor);
  return 'Upcoming';
}
function renderBar(){
  $('#rbar').innerHTML=`<button class="btn sm" data-nav="-1" aria-label="Previous">‹</button><button class="btn sm" data-nav="1" aria-label="Next">›</button><button class="btn sm" data-today="1">Today</button>${view==='week'||view==='day'||view==='month'?`<em class="wkc big">WEEK ${amzWeek(cursor).n}</em>`:(view==='agenda'?`<b class="ctitle">${esc(titleText())}</b>`:'')}<span class="sp"></span><div class="seg">${VIEWS.map(v=>`<button class="chip${view===v[0]?' on':''}" data-view="${v[0]}">${v[1]}</button>`).join('')}</div>`;
}
const timeLbl=b=>b.time?esc(b.time):'ALL DAY';
function chip(b,d){ const st=stateOf(b,d); return `<button class="bchip${isDone(b,d)?' done':''}${st?' '+st:''}" style="--c:${colOf(b)}" data-edit="${b.id}" data-date="${d}" title="${esc((b.time||'All day')+' · '+b.title+(b.site?' · '+b.site:''))}"><i>${b.time?esc(b.time):'ALL'}</i><span>${esc(b.title)}</span></button>`; }
function renderMain(){
  const el=$('#cal'); const td=today();
  const pill=(b,d)=>{const st=stateOf(b,d);return `<button class="pl${isDone(b,d)?' done':''}${st?' '+st:''}" style="--c:${colOf(b)}" data-edit="${b.id}" data-date="${d}" title="${esc(b.notes||'')}"><i>${b.time?esc(b.time):'ALL DAY'}</i><span class="pt">${esc(b.title)}</span>${b.notes?`<small class="pn">${esc(b.notes)}</small>`:''}<span class="pf">${b.site?`<em>${esc(b.site)}</em>`:''}${b.repeat?'<u>↻ WEEKLY</u>':''}</span></button>`;};
  if(view==='month'){
    const c=parse(cursor), y=c.getFullYear(), mo=c.getMonth(), first=ymd(new Date(y,mo,1));
    const off=new Date(y,mo,1).getDay(), dim=new Date(y,mo+1,0).getDate(), rows=Math.ceil((off+dim)/7);
    const start=addDays(first,-off); let h=DOW.map(x=>`<div class="mdow3">${x}</div>`).join('');
    for(let i=0;i<rows*7;i++){
      const d=addDays(start,i), L=bookingsFor(d), other=parse(d).getMonth()!==mo, n=L.length;
      const segs=L.slice(0,8).map(b=>`<i style="--c:${colOf(b)}"></i>`).join('');
      h+=`<div class="mc3${other?' dim':''}${d===td?' today':''}${d<td?' past':''}${n?' has':''}" style="--l:${Math.min(n,5)}" data-goday="${d}"><div class="m3t"><span class="num">${parse(d).getDate()}</span>${i%7===0?`<em class="wkc sm">WK ${amzWeek(d).n}</em>`:''}<button class="plus" data-new="${d}" title="Add booking">＋</button></div><div class="m3b"><span class="cnt">${n?n+(n>1?' bookings':' booking'):'Free'}</span><span class="segs">${segs}</span></div></div>`;
    }
    let mt=0; for(let i=1;i<=dim;i++) mt+=bookingsFor(first.slice(0,8)+pad(i)).length;
    const w1=amzWeek(first).n, w2=amzWeek(ymd(new Date(y,mo,dim))).n;
    el.innerHTML=`<div class="wkh mstrip"><span>${esc(titleText().toUpperCase())}</span><u>WEEKS ${w1} – ${w2} · ${mt} ${mt===1?'BOOKING':'BOOKINGS'}</u></div><div class="mgrid3">${h}</div><div class="legend3">Quiet <i style="--l:0"></i><i style="--l:1"></i><i style="--l:2"></i><i style="--l:3"></i><i style="--l:5"></i> Busy</div>`;
  }else if(view==='week'){
    const m=mondayOf(cursor); let h='';
    const wdays=Array.from({length:7},(_,i)=>addDays(m,i));
    const sel=(wkSel&&wdays.includes(wkSel))?wkSel:(wdays.includes(td)?td:m);
    for(let i=0;i<7;i++){
      const d=wdays[i], L=bookingsFor(d);
      h+=`<button class="wd${d===td?' today':''}${d<td?' past':''}${d===sel?' sel':''}" data-wsel="${d}"><span class="kw">${DOW[i].toUpperCase()}</span><span class="kn">${parse(d).getDate()}</span><span class="kf"><span class="dots">${L.slice(0,8).map(()=>'<u></u>').join('')}</span><span class="kc${L.length?'':' fr'}">${L.length?L.length+(L.length>1?' bookings':' booking'):'Free'}</span></span></button>`;
    }
    const SL=bookingsFor(sel);
    el.innerHTML=`<div class="wkh"><span>${esc(fmtLong(sel))}</span><u>WEEK ${amzWeek(sel).n} · ${SL.length} ${SL.length===1?'BOOKING':'BOOKINGS'}</u></div><div class="wkt">${h}</div>`+(SL.length?`<div class="dlist">${dgroups(SL,sel)}</div>`:`<div class="cempty"><b>Nothing booked for this day</b>Use the button below to add a booking.</div>`)+`<div style="margin-top:16px"><button class="btn pri" data-new="${sel}">＋ ADD BOOKING FOR THIS DAY</button></div>`;
  }else if(view==='day'){
    const L=bookingsFor(cursor);
    el.innerHTML=dstrip(cursor,L.length)+(L.length?`<div class="dlist">${dgroups(L,cursor)}</div>`:`<div class="cempty"><b>Nothing booked for this day</b>Use the button below to add a booking.</div>`)+`<div style="margin-top:16px"><button class="btn pri" data-new="${cursor}">＋ ADD BOOKING FOR THIS DAY</button></div>`;
  }else{
    let h='',n=0;
    for(let i=0;i<90;i++){ const d=addDays(cursor,i), L=bookingsFor(d); if(!L.length) continue; n+=L.length; h+=`${dstrip(d,L.length,d===td?'Today · ':'')}<div class="dlist">${dgroups(L,d)}</div>`; }
    el.innerHTML=h||`<div class="cempty"><b>No upcoming bookings</b>Nothing in the next 90 days${siteF||q?' for this filter':''}.</div>`;
  }
}
function dstrip(d,n,pre){ return `<div class="wkh"><span>${pre||''}${esc(fmtLong(d))}</span><u>WEEK ${amzWeek(d).n} · ${n} ${n===1?'BOOKING':'BOOKINGS'}</u></div>`; }
function dgroups(L,d){
  const hr=b=>{const m=/^(\d{1,2})/.exec(b.time||'');return m?+m[1]:-1};
  const G=[['MORNING',L.filter(b=>hr(b)>=0&&hr(b)<12)],['AFTERNOON',L.filter(b=>hr(b)>=12)],['ALL DAY',L.filter(b=>hr(b)<0)]];
  return G.filter(g=>g[1].length).map(g=>`<div class="gh">${g[0]}</div><div class="dgrp">${g[1].map(b=>drow(b,d)).join('')}</div>`).join('');
}
function drow(b,d){
  const dn=(b.done||{})[d], st=stateOf(b,d);
  return `<div class="drow${dn?' done':''}${st?' '+st:''}" style="--c:${colOf(b)}"><button class="tick${dn?' on':''}" data-tick="${b.id}" data-date="${d}" title="${dn?'Click to undo':'Mark as done'}">${dn?esc(initials(dn.by)||'✓'):''}</button><span class="tm">${timeLbl(b)}</span><span class="dt"><b>${esc(b.title)}</b>${b.notes?`<small class="nt">${esc(b.notes)}</small>`:''}</span>${b.site?`<span class="tag st">${esc(b.site)}</span>`:''}${b.repeat==='weekly'?'<span class="tag">↻ WEEKLY</span>':''}${st==='over'?'<span class="tag" style="background:var(--bad-soft);color:var(--bad-text)">OVERDUE</span>':''}<span class="by">${dn?esc(initials(dn.by)||'')+' · done':esc(b.by||'?')}</span><button class="ib" data-edit="${b.id}" data-date="${d}" title="Edit">✎</button><button class="ib bad" data-del="${b.id}" title="Delete">✕</button></div>`;
}

/* ---------- add / edit modal ---------- */
function openModal(id,date){
  const b=id?bookings[id]:null; if(id&&!b) return;
  draft=b?{...b,_occ:date||b.date,isNew:false}:{id:uid('b'),title:'',date:date||cursor,time:'',site:'',repeat:'',by:me(),created:new Date().toISOString(),done:{},_occ:date||cursor,isNew:true};
  const siteOpts='<option value="">All sites / none</option>'+SITES.map(x=>`<option ${draft.site===x?'selected':''}>${x}</option>`).join('');
  const dn=draft.isNew?null:(draft.done||{})[draft._occ];
  $('#modal').innerHTML=`<div class="ov"><div class="bk" data-close="1"></div><div class="box cb" role="dialog" aria-label="${draft.isNew?'New booking':'Edit booking'}">
    <div class="mh"><b>${draft.isNew?'New booking':'Edit booking'}</b><button class="x" data-close="1" aria-label="Close"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
    <div class="ff"><label class="lbl" for="fTitle">What is booked</label><input class="fld" id="fTitle" maxlength="120" value="${esc(draft.title)}" placeholder="e.g. Collect van from Halfords"></div>
    <div class="row2"><div class="ff"><label class="lbl" for="fDate">Date</label><input class="fld" type="date" id="fDate" value="${esc(draft.date)}"></div>
    <div class="ff"><label class="lbl" for="fTime">Time</label><input class="fld" type="time" id="fTime" value="${esc(draft.time)}"><div class="hint">Leave empty for all day</div></div></div>
    <div class="row2"><div class="ff"><label class="lbl" for="fSite">Site</label><select class="fld" id="fSite">${siteOpts}</select></div>
    <div class="ff"><label class="lbl" for="fRep">Repeat</label><select class="fld" id="fRep"><option value="">One-off</option><option value="weekly" ${draft.repeat==='weekly'?'selected':''}>Every week</option></select></div></div>
    <div class="ff"><label class="lbl" for="fNotes">Notes</label><textarea class="fld" id="fNotes" maxlength="500" placeholder="Anything people need to know on the day (shows on the Day view and in Daily Tasks)…">${esc(draft.notes||'')}</textarea></div>
    ${draft.isNew?'':`<div class="hint" style="margin:-4px 0 4px">${draft.repeat==='weekly'?'This repeats weekly from '+esc(fmtShort(draft.date))+'. Changes apply to every week. ':''}${esc(draft.by||'?')}</div>

function closeModal(){ draft=null; $('#modal').innerHTML=''; }
async function saveDraft(){
  const title=$('#fTitle').value.trim(), date=$('#fDate').value;
  if(!title){ $('#fTitle').focus(); return; } if(!date){ $('#fDate').focus(); return; }
  const b={...draft}; delete b._occ; delete b.isNew;
  b.title=title; b.date=date; b.time=$('#fTime').value||''; b.site=$('#fSite').value; b.repeat=$('#fRep').value; b.notes=$('#fNotes').value.trim(); b.by=b.by||me();
  const was=draft.isNew; bookings[b.id]=b; closeModal(); renderAll(); toast(was?'Booking added for '+fmtShort(b.date):'Booking saved'); await store.save(b);
}
async function toggleDone(id,date){
  const b=bookings[id]; if(!b) return; b.done=b.done||{};
  if(b.done[date]) delete b.done[date]; else b.done[date]={t:new Date().toISOString(),by:me()};
  renderAll(); await store.save(b);
}
async function deleteBooking(id){
  const b=bookings[id]; if(!b) return;
  if(!(await wlAsk('Delete “'+b.title+'”?'+(b.repeat?' This removes every week.':'')+' It will disappear from Daily Tasks too.',{title:'Delete booking',ok:'Delete'}))) return;
  delete bookings[id]; closeModal(); renderAll(); toast('Booking deleted'); await store.del(id);
}

/* ---------- events ---------- */
function step(n){
  const d=parse(cursor);
  if(view==='month'){ cursor=ymd(new Date(d.getFullYear(),d.getMonth()+n,1)); }
  else if(view==='week'||view==='agenda') cursor=addDays(cursor,7*n);
  else cursor=addDays(cursor,n);
  renderAll();
}
document.addEventListener('click',async e=>{
  const g=s=>e.target.closest(s); let el;
  if(g('[data-close]')&&!g('.box')||(el=g('.x[data-close],.btn[data-close]'))) return closeModal();
  if((el=g('[data-nav]'))) return step(+el.dataset.nav);
  if(g('[data-today]')){ cursor=today(); return renderAll(); }
  if((el=g('[data-view]'))&&el.classList.contains('chip')){ view=el.dataset.view; return renderAll(); }
  if((el=g('[data-site]'))){ const s=el.dataset.site; siteF=(s==='-')?'-':s; return renderAll(); }
  if((el=g('[data-new]'))) return openModal(null,el.dataset.new);
  if((el=g('[data-wsel]'))){ wkSel=el.dataset.wsel; return renderMain(); }
  if((el=g('[data-goday]'))){ cursor=el.dataset.goday; view='day'; return renderAll(); }
  if((el=g('[data-new]'))) return openModal(null,el.dataset.new);
  if(g('#newBtn')) return openModal(null,cursor);
  if((el=g('[data-tick]'))) return toggleDone(el.dataset.tick,el.dataset.date);
  if((el=g('[data-del]'))) return deleteBooking(el.dataset.del);
  if(g('[data-done]')&&draft){ const id=draft.id,d=draft._occ; closeModal(); return toggleDone(id,d); }
  if(g('[data-save]')) return saveDraft();
  if((el=g('[data-edit]'))) return openModal(el.dataset.edit,el.dataset.date);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&draft) closeModal();
  if(e.key==='Enter'&&draft&&e.target.matches&&e.target.matches('#fTitle,#fDate,#fTime')){ e.preventDefault(); saveDraft(); }
});
$('#search').addEventListener('input',e=>{ q=e.target.value; renderMain(); renderSide(); });
/* site filter "No site" support */
const _m=matches; matches=function(b){ if(siteF==='-'){ if(b.site) return false; const n=q.trim().toLowerCase(); return !n||((b.title||'')+' '+(b.by||'')).toLowerCase().includes(n); } return _m(b); };
setInterval(()=>{ if(!draft) renderAll(); },60000);
renderAll(); store.init();
</script>

(function(){
  var ovF=null,LAB={today:'Today',week:'This week',month:'This month',repeat:'Weekly repeats',over:'Overdue today'};
  var _bf=bookingsFor;
  bookingsFor=function(date){
    var L=_bf(date);if(!ovF)return L;var t=today();
    if(ovF==='today')return date===t?L:[];
    if(ovF==='week'){var w=amzWeek(t);return(date>=w.start&&date<=w.end)?L:[]}
    if(ovF==='month')return date.slice(0,7)===t.slice(0,7)?L:[];
    if(ovF==='repeat')return L.filter(function(b){return b.repeat==='weekly'});
    if(ovF==='over')return date===t?L.filter(function(b){return stateOf(b,date)==='over'}):[];
    return L};
  function count(){var t=today(),n=0,i;
    if(ovF==='today'||ovF==='over')return bookingsFor(t).length;
    if(ovF==='week'){var w=amzWeek(t);for(i=0;i<7;i++)n+=bookingsFor(addDays(w.start,i)).length;return n}
    if(ovF==='month'){var dim=new Date(parse(t).getFullYear(),parse(t).getMonth()+1,0).getDate();for(i=1;i<=dim;i++)n+=bookingsFor(t.slice(0,7)+'-'+pad(i)).length;return n}
    return Object.values(bookings).filter(function(b){return b.repeat==='weekly'&&matches(b)}).length}
  var rs=renderSide;
  renderSide=function(){var o=ovF;ovF=null;rs();ovF=o;
    var rows=document.querySelectorAll('#stats .sb-row'),K=['today','week','month','repeat','over'],vals=[],mx=1;
    rows.forEach(function(r){var n=+r.querySelector('.sb-n').textContent;vals.push(n);if(n>mx)mx=n});
    var h='';rows.forEach(function(r,i){h+='<button type="button" class="ov'+(ovF===K[i]?' on':'')+'" data-ov="'+K[i]+'" aria-pressed="'+(ovF===K[i])+'"><span class="ot"><u>'+vals[i]+'</u><b>'+r.querySelector('.sb-lb').textContent+'</b></span><s><i style="width:'+Math.round(vals[i]/mx*100)+'%"></i></s></button>'});
    document.getElementById('hfStats').innerHTML=h};
  var rm=renderMain;
  renderMain=function(){rm();if(!ovF)return;var el=document.getElementById('cal'),n=count(),d=document.createElement('div');d.className='ovban';
    d.innerHTML='<span>Showing · '+LAB[ovF]+'</span><u>'+n+(n===1?' booking':' bookings')+'</u><button type="button" data-ovclear="1">✕ Clear filter</button>';el.insertBefore(d,el.firstChild)};
  document.addEventListener('click',function(e){
    var c=e.target.closest('[data-ovclear]');if(c){ovF=null;renderAll();return}
    var b=e.target.closest('[data-ov]');if(!b)return;var k=b.dataset.ov;
    if(ovF===k){ovF=null}else{ovF=k;cursor=today();wkSel=null;view=(k==='today'||k==='over')?'day':(k==='week'?'week':(k==='month'?'month':'agenda'))}
    renderAll()});
  renderAll();
})();

}
