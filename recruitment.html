<style>
:root{
  --bg:#f3f5fa; --card:#ffffff; --card2:#f5f7fc; --line:#e4e8f1; --line2:#cbd3e3;
  --text:#0f172a; --mute:#64748b; --faint:#94a3b8; --track:#e8ecf5; --hover:#f1f4fb;
  --accent:#7C3AED; --accent2:#A855F7; --accent-soft:#F1EAFF; --accent-text:#6D28D9; --on-accent:#ffffff;
  --ok:#16a34a; --ok-soft:#e7f7ec; --bad:#ef4444; --bad-soft:#fdecec; --bad-text:#b91c1c;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 6px 20px rgba(15,23,42,.05);
  --shadow-lg:0 10px 30px rgba(124,58,237,.28);
}
:root[data-theme="dark"]{
  --bg:#18181A; --card:#242526; --card2:#2D2E30; --line:#3D3E40; --line2:#595A5D;
  --text:#EFF0F1; --mute:#A7A8AB; --faint:#7E7F82; --track:#37383A; --hover:#2E2F31;
  --accent:#A855F7; --accent2:#7C3AED; --accent-soft:#2b1f4f; --accent-text:#C4B5FD; --on-accent:#ffffff;
  --ok:#34d399; --ok-soft:#10312a; --bad:#f87171; --bad-soft:#3b1a22; --bad-text:#fca5a5;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --shadow-lg:0 10px 30px rgba(168,85,247,.28);
}
html{scrollbar-gutter:stable;overflow-y:scroll}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
body{min-width:1100px}
button,input,select,textarea{font-family:inherit;font-size:inherit}
.topline{position:fixed;top:0;left:0;right:0;height:4px;z-index:950;pointer-events:none;background:linear-gradient(90deg,var(--accent),var(--accent2))}

/* ---------- page rail (same as the other pages) ---------- */
.wl-rail{position:fixed;left:0;top:0;bottom:0;width:76px;z-index:100;display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 0 16px;background:#1E2023;border-right:1px solid #494A4F}
.wl-rail .rl-logo{width:42px;height:42px;border-radius:4px;display:grid;place-items:center;margin-bottom:14px;background:linear-gradient(135deg,#7C3AED,#A855F7);color:#fff;font-weight:800;font-size:19px}
.wl-rail a,.wl-rail button{all:unset;cursor:pointer;box-sizing:border-box;width:64px;padding:9px 0 8px;border-radius:4px;display:flex;flex-direction:column;align-items:center;gap:5px;text-decoration:none;color:#B9BCC3;font-size:10px;font-weight:600;letter-spacing:.02em;text-align:center;line-height:1.15;transition:.15s}
.wl-rail a:hover,.wl-rail button:hover{background:rgba(255,255,255,.09);color:#fff}
.wl-rail a.on{background:linear-gradient(160deg,#7C3AED,#A855F7);color:#fff;box-shadow:0 8px 18px -8px rgba(124,58,237,.8)}
.wl-rail .rl-sp{flex:1}
.wl-rail .rl-logo,.rail .rl-logo{cursor:pointer;transition:.15s}.wl-rail .rl-logo:hover,.rail .rl-logo:hover{filter:brightness(1.12)}


/* ---------- left info panel (identical to Daily Tasks / Wave Plan) ---------- */
body{padding-left:448px}
.wp-side{position:fixed;left:76px;top:0;bottom:0;width:372px;z-index:90;overflow-y:auto;overflow-x:hidden;padding:30px 29px 28px;background:linear-gradient(180deg,#ECEDEF,#E2D4F8);border-right:2px solid #CDB8F0;scrollbar-width:thin}
:root[data-theme="dark"] .wp-side{background:radial-gradient(120% 60% at 50% 100%,color-mix(in srgb,var(--accent) 32%,transparent),transparent 70%),#1B1C1F;border-right:1px solid #33353A}
.wp-hero{position:relative;overflow:hidden;border-radius:4px;color:#fff;background:linear-gradient(160deg,#7C3AED 0%,#8F47F2 50%,#A855F7 100%);box-shadow:0 12px 24px -14px rgba(76,29,149,.7)}
.h4-c1,.h4-c2{position:absolute!important;border-radius:50%;pointer-events:none;z-index:0!important}
.h4-c1{right:-70px;top:40px;width:200px;height:200px;border:30px solid rgba(255,255,255,.10)}
.h4-c2{right:20px;bottom:-90px;width:150px;height:150px;background:rgba(255,255,255,.06)}
.wp-hero>*{position:relative;z-index:1}
.wp-top{background:#fff;color:#181819;padding:14px 16px 12px}
:root[data-theme="dark"] .wp-top{background:#292A2B;color:#EFF0F1}
:root[data-theme="dark"] .wp-sub{color:#A7A8AB;border-top-color:#414244}
.wp-brandrow{position:relative;display:flex;align-items:center;justify-content:center;min-height:42px}
.wp-logo{position:absolute;left:8px;top:0;width:42px;height:42px;border-radius:4px;display:grid;place-items:center;font-size:20px;font-weight:800;color:#fff;background:#7C3AED}
.wp-title{min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 52px}
.wp-title small{display:block;font-size:9px;font-weight:700;letter-spacing:.2em;color:#7C3AED;line-height:1;margin-bottom:4px}
.wp-title h1{margin:0;font-size:21px;font-weight:800;letter-spacing:.01em;line-height:1.05;color:inherit;text-transform:uppercase}
.wp-sub{margin-top:11px;padding-top:10px;border-top:1px solid #E5E5E6;text-align:center;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6E6E70}
.wp-body{padding:14px 16px 16px}
.wp-btn{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:12px 8px;border-radius:4px;background:#fff;color:#6D28D9;font-size:12px;font-weight:800;letter-spacing:.08em;box-shadow:0 4px 10px -6px rgba(23,18,31,.35)}
.wp-btn:hover{filter:brightness(.96)}
.wp-new{display:block;width:100%;margin-bottom:0}
.sb-h{display:flex;align-items:center;gap:10px;margin:22px 4px 11px;font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:#6E6E70}.sb-h::after{content:"";flex:1;height:1px;background:#E5E5E6}
:root[data-theme="dark"] .sb-h{color:#A7A8AB}:root[data-theme="dark"] .sb-h::after{background:#414244}
.sb-card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:4px 14px;box-shadow:0 1px 2px rgba(23,18,31,.04),0 4px 10px -8px rgba(124,58,237,.3)}
.sb-row{display:grid;grid-template-columns:34px 1fr auto;column-gap:12px;align-items:center;padding:10px 0}.sb-row+.sb-row{border-top:1px solid var(--line)}
.sb-ic{display:grid;place-items:center;width:34px;height:34px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.sb-lb{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--text)}
.sb-n{display:grid;place-items:center;width:34px;height:34px;box-sizing:border-box;font-size:13px;font-weight:700;color:var(--accent-text);background:var(--accent-soft);border-radius:4px;padding:0;font-variant-numeric:tabular-nums}
.wp-search{display:block;width:100%;box-sizing:border-box;margin-bottom:12px;padding:11px 12px;border-radius:4px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.18);color:#fff;font:inherit;font-size:12px;outline:none}
.wp-search::placeholder{color:rgba(255,255,255,.75)}
.wp-search:focus{background:rgba(255,255,255,.28);border-color:#fff;box-shadow:none}
.wp-chip:empty{display:none}
.wp-chip{display:inline-block;background:#fff;color:#7C3AED;font-size:10px;font-weight:800;letter-spacing:.14em;padding:5px 12px;border-radius:4px;margin:0 0 12px;text-transform:uppercase}
.wp-tags{display:flex;flex-direction:column;gap:6px}
.fl{font-size:10px;font-weight:800;letter-spacing:.16em;color:rgba(255,255,255,.85);margin:0 0 2px}
.frow{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:4px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.frow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow i{flex:none;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5)}
.frow b{flex:none;font-size:10px;background:rgba(255,255,255,.2);border-radius:4px;padding:2px 7px}
.frow:hover{border-color:#fff}
.frow.on{background:#fff;border-color:#fff;color:#6D28D9}.frow.on i{background:#7C3AED}.frow.on b{background:#F1EAFF}
.wp-tags .chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff}
.wp-tags .chip:hover{border-color:#fff}
.wp-tags .chip.on{background:#fff;border-color:#fff;color:#6D28D9}
.wp-sync{margin-top:14px;text-align:center}
.wp-sync .pill{display:block}
.pg{padding:30px 22px 40px}

/* ---------- page ---------- */
.pg{padding:30px 22px 40px;margin:0 auto}
.ph{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.ph .ic{width:46px;height:46px;border-radius:4px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.ph h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.01em}
.ph p{margin:3px 0 0;color:var(--mute);font-size:13px}
.ph .sp{flex:1}
.pill{font-size:11px;font-weight:600;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:8px 12px;white-space:nowrap}
.pill.ok{color:var(--ok)}
.btn{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:10px 14px;font-weight:600;font-size:13px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--hover);border-color:var(--line2)}
.btn.sm{padding:8px 10px;font-size:12px}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);border-color:transparent;box-shadow:0 4px 14px rgba(124,58,237,.28);font-weight:800;letter-spacing:.05em}
.btn.pri:hover{filter:brightness(1.07)}
.btn.bad{color:var(--bad-text)} .btn.bad:hover{background:var(--bad-soft);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.search{flex:0 0 280px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:4px;padding:10px 12px;outline:none}
.search:focus,.fld:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.16)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;font-size:11px;font-weight:700;letter-spacing:.06em;padding:7px 11px;border-radius:4px;background:var(--card);border:1px solid var(--line);color:var(--mute);text-transform:uppercase}
.chip:hover{border-color:var(--line2)} .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.count{margin-left:auto;font-size:12px;color:var(--mute);font-weight:600}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:stretch}
.pc{position:relative;background:var(--card);border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);border-radius:4px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.pimg{all:unset;display:block;cursor:zoom-in;background:var(--card2);position:relative;border-bottom:1px solid var(--line)}
.pimg{aspect-ratio:3/4;overflow:hidden}
.pimg img{display:block;width:100%;height:100%;object-fit:contain;background:var(--card2)}
.ptag{position:absolute;left:8px;bottom:8px;background:var(--card)!important;box-shadow:0 2px 8px rgba(15,23,42,.2)}
.ph{padding:10px;border-bottom:1px solid var(--line)}
.pedit{position:absolute;top:50px;right:8px;width:30px;height:30px;padding:0;border-radius:4px;background:var(--card);box-shadow:0 2px 8px rgba(15,23,42,.25);color:var(--accent-text)}
.pb{padding:10px;display:flex;flex-direction:column;gap:7px}
.pt{display:flex;align-items:flex-start;justify-content:center;text-align:center;gap:10px}
.pt{min-height:0;width:100%}
.pt h3{flex:1;min-width:0}
.pt h3{width:100%;text-align:center;display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;margin:0;font-size:13.5px;font-weight:800;line-height:1.25;text-transform:uppercase;letter-spacing:.02em}
.tag{flex:none;font-size:8.5px;font-weight:800;letter-spacing:.08em;padding:3px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent-text);text-transform:uppercase}
.msg{margin:0;font-size:11.5px;line-height:1.4;color:var(--mute);white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;background:var(--card2);border:1px solid var(--line);border-radius:4px;padding:6px 8px}
.msg.none{font-style:italic;color:var(--faint)}
