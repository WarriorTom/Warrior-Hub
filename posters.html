<style>
:root{
  --bg:#f3f5fa; --card:#ffffff; --card2:#f5f7fc; --line:#e4e8f1; --line2:#cbd3e3;
  --text:#0f172a; --mute:#64748b; --faint:#94a3b8; --track:#e8ecf5; --hover:#f1f4fb;
  --accent:#7C3AED; --accent2:#A855F7; --accent-soft:#F1EAFF; --accent-text:#6D28D9; --on-accent:#ffffff;
  --ok:#16a34a; --ok-soft:#e7f7ec; --bad:#ef4444; --bad-soft:#fdecec; --bad-text:#b91c1c;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 6px 20px rgba(15,23,42,.05);
  --shadow-lg:0 10px 30px rgba(124,58,237,.28);
}
:root[data-theme="dark"]{
  --bg:#18181A; --card:#242526; --card2:#2D2E30; --line:#3D3E40; --line2:#595A5D;
  --text:#EFF0F1; --mute:#A7A8AB; --faint:#7E7F82; --track:#37383A; --hover:#2E2F31;
  --accent:#A855F7; --accent2:#7C3AED; --accent-soft:#2b1f4f; --accent-text:#C4B5FD; --on-accent:#ffffff;
  --ok:#34d399; --ok-soft:#10312a; --bad:#f87171; --bad-soft:#3b1a22; --bad-text:#fca5a5;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --shadow-lg:0 10px 30px rgba(168,85,247,.28);
}
html{scrollbar-gutter:stable;overflow-y:scroll}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
body{min-width:1100px}
button,input,select,textarea{font-family:inherit;font-size:inherit}
.topline{position:fixed;top:0;left:0;right:0;height:4px;z-index:950;pointer-events:none;background:linear-gradient(90deg,var(--accent),var(--accent2))}

/* ---------- page rail (same as the other pages) ---------- */
.wl-rail{position:fixed;left:0;top:0;bottom:0;width:76px;z-index:100;display:flex;flex-direction:column;align-items:center;gap:6px;padding:26px 0 16px;background:#1E2023;border-right:1px solid #494A4F}
.wl-rail .rl-logo{width:42px;height:42px;border-radius:4px;display:grid;place-items:center;margin-bottom:14px;background:linear-gradient(135deg,#7C3AED,#A855F7);color:#fff;font-weight:800;font-size:19px}
.wl-rail a,.wl-rail button{all:unset;cursor:pointer;box-sizing:border-box;width:64px;padding:9px 0 8px;border-radius:4px;display:flex;flex-direction:column;align-items:center;gap:5px;text-decoration:none;color:#B9BCC3;font-size:10px;font-weight:600;letter-spacing:.02em;text-align:center;line-height:1.15;transition:.15s}
.wl-rail a:hover,.wl-rail button:hover{background:rgba(255,255,255,.09);color:#fff}
.wl-rail a.on{background:linear-gradient(160deg,#7C3AED,#A855F7);color:#fff;box-shadow:0 8px 18px -8px rgba(124,58,237,.8)}
.wl-rail .rl-sp{flex:1}
.wl-rail .rl-logo,.rail .rl-logo{cursor:pointer;transition:.15s}.wl-rail .rl-logo:hover,.rail .rl-logo:hover{filter:brightness(1.12)}


/* ---------- left info panel (identical to Daily Tasks / Wave Plan) ---------- */
body{padding-left:448px}
.wp-side{position:fixed;left:76px;top:0;bottom:0;width:372px;z-index:90;overflow-y:auto;overflow-x:hidden;padding:30px 29px 28px;background:linear-gradient(180deg,#ECEDEF,#E2D4F8);border-right:2px solid #CDB8F0;scrollbar-width:thin}
:root[data-theme="dark"] .wp-side{background:radial-gradient(120% 60% at 50% 100%,color-mix(in srgb,var(--accent) 32%,transparent),transparent 70%),#1B1C1F;border-right:1px solid #33353A}
.wp-hero{position:relative;overflow:hidden;border-radius:4px;color:#fff;background:linear-gradient(160deg,#7C3AED 0%,#8F47F2 50%,#A855F7 100%);box-shadow:0 12px 24px -14px rgba(76,29,149,.7)}
.h4-c1,.h4-c2{position:absolute!important;border-radius:50%;pointer-events:none;z-index:0!important}
.h4-c1{right:-70px;top:40px;width:200px;height:200px;border:30px solid rgba(255,255,255,.10)}
.h4-c2{right:20px;bottom:-90px;width:150px;height:150px;background:rgba(255,255,255,.06)}
.wp-hero>*{position:relative;z-index:1}
.wp-top{background:#fff;color:#181819;padding:14px 16px 12px}
:root[data-theme="dark"] .wp-top{background:#292A2B;color:#EFF0F1}
:root[data-theme="dark"] .wp-sub{color:#A7A8AB;border-top-color:#414244}
.wp-brandrow{position:relative;display:flex;align-items:center;justify-content:center;min-height:42px}
.wp-logo{position:absolute;left:8px;top:0;width:42px;height:42px;border-radius:4px;display:grid;place-items:center;font-size:20px;font-weight:800;color:#fff;background:#7C3AED}
.wp-title{min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 52px}
.wp-title small{display:block;font-size:9px;font-weight:700;letter-spacing:.2em;color:#7C3AED;line-height:1;margin-bottom:4px}
.wp-title h1{margin:0;font-size:21px;font-weight:800;letter-spacing:.01em;line-height:1.05;color:inherit;text-transform:uppercase}
.wp-sub{margin-top:11px;padding-top:10px;border-top:1px solid #E5E5E6;text-align:center;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:#6E6E70}
.wp-body{padding:14px 16px 16px}
.wp-btn{all:unset;box-sizing:border-box;cursor:pointer;text-align:center;padding:12px 8px;border-radius:4px;background:#fff;color:#6D28D9;font-size:12px;font-weight:800;letter-spacing:.08em;box-shadow:0 4px 10px -6px rgba(23,18,31,.35)}
.wp-btn:hover{filter:brightness(.96)}
.wp-new{display:block;width:100%;margin-bottom:12px}
.wp-search{display:block;width:100%;box-sizing:border-box;margin-bottom:12px;padding:11px 12px;border-radius:4px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.18);color:#fff;font:inherit;font-size:12px;outline:none}
.wp-search::placeholder{color:rgba(255,255,255,.75)}
.wp-search:focus{background:rgba(255,255,255,.28);border-color:#fff;box-shadow:none}
.wp-chip:empty{display:none}
.wp-chip{display:inline-block;background:#fff;color:#7C3AED;font-size:10px;font-weight:800;letter-spacing:.14em;padding:5px 12px;border-radius:4px;margin:0 0 12px;text-transform:uppercase}
.wp-tags{display:flex;flex-direction:column;gap:6px}
.fl{font-size:10px;font-weight:800;letter-spacing:.16em;color:rgba(255,255,255,.85);margin:0 0 2px}
.frow{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:4px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.frow span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow i{flex:none;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5)}
.frow b{flex:none;font-size:10px;background:rgba(255,255,255,.2);border-radius:4px;padding:2px 7px}
.frow:hover{border-color:#fff}
.frow.on{background:#fff;border-color:#fff;color:#6D28D9}.frow.on i{background:#7C3AED}.frow.on b{background:#F1EAFF}
.wp-tags .chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff}
.wp-tags .chip:hover{border-color:#fff}
.wp-tags .chip.on{background:#fff;border-color:#fff;color:#6D28D9}
.wp-sync{margin-top:14px;text-align:center}
.wp-sync .pill{display:block}
.pg{padding:30px 22px 40px}

/* ---------- page ---------- */
.pg{padding:30px 22px 40px;margin:0 auto}
.ph{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.ph .ic{width:46px;height:46px;border-radius:4px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.ph h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.01em}
.ph p{margin:3px 0 0;color:var(--mute);font-size:13px}
.ph .sp{flex:1}
.pill{font-size:11px;font-weight:600;color:var(--mute);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:8px 12px;white-space:nowrap}
.pill.ok{color:var(--ok)}
.btn{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:10px 14px;font-weight:600;font-size:13px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.btn:hover{background:var(--hover);border-color:var(--line2)}
.btn.sm{padding:8px 10px;font-size:12px}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);border-color:transparent;box-shadow:0 4px 14px rgba(124,58,237,.28);font-weight:800;letter-spacing:.05em}
.btn.pri:hover{filter:brightness(1.07)}
.btn.bad{color:var(--bad-text)} .btn.bad:hover{background:var(--bad-soft);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.search{flex:0 0 280px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:4px;padding:10px 12px;outline:none}
.search:focus,.fld:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,58,237,.16)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.rpanel{background:var(--card);border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow)}
.rbar{position:sticky;top:0;z-index:60;background:var(--card);border-radius:4px 4px 0 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0;padding:14px 22px;border-bottom:1px solid var(--line)}
.rpanel .grid{padding:24px 22px 26px;gap:22px}
.ddw{position:relative;display:inline-block}
.bt3{all:unset;cursor:pointer;box-sizing:border-box;padding:8px 12px;border-radius:4px;background:var(--card);border:1px solid var(--line);font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.bt3:hover{border-color:var(--accent)}.bt3.on{background:var(--accent);border-color:var(--accent);color:#fff}.bt3.clr{color:var(--accent-text);margin-left:2px}
.pop3{position:absolute;top:100%;left:0;margin-top:6px;background:var(--card);border:1px solid var(--line2,var(--line));border-radius:6px;box-shadow:0 14px 30px -10px rgba(23,18,63,.35);z-index:20;display:flex;flex-direction:column;max-height:70vh;overflow:auto;min-width:290px;overflow:hidden auto}
.fro{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;padding:11px 14px;border-left:5px solid var(--c);border-bottom:1px solid var(--line);font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--text);background:var(--card)}
.fro:last-child{border-bottom:0}.fro:hover{background:color-mix(in srgb,var(--c) 7%,var(--card))}.fro span{flex:1}.fro b{font-size:10.5px;background:var(--track);border-radius:4px;padding:2px 7px;color:var(--mute)}
.fro.on{background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--c)}.fro.on b{background:var(--c);color:#fff}
.chip{all:unset;cursor:pointer;font-size:11px;font-weight:700;letter-spacing:.06em;padding:7px 11px;border-radius:4px;background:var(--card);border:1px solid var(--line);color:var(--mute);text-transform:uppercase}
.chip:hover{border-color:var(--line2)} .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.count{margin-left:auto;font-size:12px;color:var(--mute);font-weight:600}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:stretch}
.pc{position:relative;background:var(--card);border:1px solid color-mix(in srgb,var(--accent) 55%,transparent);border-radius:4px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.pimg{all:unset;display:block;cursor:zoom-in;background:var(--card2);position:relative;border-bottom:1px solid var(--line)}
.pimg{aspect-ratio:3/4;overflow:hidden}
.pimg img{display:block;width:100%;height:100%;object-fit:contain;background:var(--card2)}
.ptag{position:absolute;left:8px;bottom:8px;background:var(--card)!important;box-shadow:0 2px 8px rgba(15,23,42,.2)}
.ph{padding:10px;border-bottom:1px solid var(--line)}
.pedit{position:absolute;top:50px;right:8px;width:30px;height:30px;padding:0;border-radius:4px;background:var(--card);box-shadow:0 2px 8px rgba(15,23,42,.25);color:var(--accent-text)}
.pb{padding:10px;display:flex;flex-direction:column;gap:7px}
.pt{display:flex;align-items:flex-start;justify-content:center;text-align:center;gap:10px}
.pt{min-height:0;width:100%}
.pt h3{flex:1;min-width:0}
.pt h3{width:100%;text-align:center;display:block;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;margin:0;font-size:13.5px;font-weight:800;line-height:1.25;text-transform:uppercase;letter-spacing:.02em}
.tag{flex:none;font-size:8.5px;font-weight:800;letter-spacing:.08em;padding:3px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent-text);text-transform:uppercase}

svg{display:block}

<script>
/* =====================================================================
   SETTINGS — paste the same Firebase web-app config you use in index.html
   (leave apiKey empty and posters are kept in this browser only)
   ===================================================================== */
/* storageBucket (e.g. "your-project.appspot.com") is where the full-resolution originals are kept.
   Cards show a compressed preview; DOWNLOAD and COPY IMAGE always use the original. */
const FIREBASE_CONFIG = window.WL_FB_CONFIG;

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lsGet=k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } };
const lsSet=(k,v)=>{ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } };
const uid=()=>'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const me=()=>lsGet('wl_name')||'';
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2600); }

let posters={};           // id -> {id,title,tag,message,img,by,created,updated}
let q='', tagF='', openDD=false;
let draft=null;           // poster being edited / created in the modal
let viewId=null;
const pend={};            // posters saved on screen but not yet confirmed by the database

/* ---------- storage: Firestore `posters/{id}`, else this browser ---------- */
const LS_KEY='wl_posters_v1';
const store={
  mode:'local', fb:null,
  async init(on){
    if(FIREBASE_CONFIG.apiKey&&!window.WL_DEMO){
      try{
        const {fs,db,app,base}=await window.wlFirebase();
        this.fb={fs,db,app,base}; this.mode='firebase';
        fs.onSnapshot(fs.collection(db,'posters'),snap=>{ const o={}; snap.forEach(d=>{o[d.id]=d.data();}); on(o); },e=>{ console.error(e); toast('Sync error – check Firestore rules'); });
        return;
      }catch(e){ console.error(e); toast('Firebase failed – using this browser only'); }
    }
    this.mode='local';
    try{ on(JSON.parse(lsGet(LS_KEY)||'{}')); }catch(e){ on({}); }
  },
  persist(){ if(!lsSet(LS_KEY,JSON.stringify(posters))) toast('This browser is full – use Firebase to store more posters'); },
  async save(p){
    if(this.mode==='firebase'){ const {fs,db}=this.fb; try{ await fs.setDoc(fs.doc(db,'posters',p.id),p); return true; }catch(e){ console.error(e); toast('Could not save – image may be too large'); return false; } }
    this.persist(); return true;
  },
  async del(id,p){
    if(p&&p.hi) this.dropOriginal({...p.hi,id});
    if(this.mode==='firebase'){ const {fs,db}=this.fb; try{ await fs.deleteDoc(fs.doc(db,'posters',id)); }catch(e){ console.error(e); toast('Could not delete'); } return; }
    this.persist();
  },
  /* ----- full-resolution originals: Firebase Storage when synced, else IndexedDB on this device ----- */
  async putOriginal(id,file){
    const name=(file.name||'poster').replace(/[^\w.\- ]+/g,'_');
    if(this.mode==='firebase' && FIREBASE_CONFIG.storageBucket){
      try{
        const st=await import(this.fb.base+'firebase-storage.js'), s=st.getStorage(this.fb.app);
        s.maxUploadRetryTime=7000; s.maxOperationRetryTime=7000;
        const path='posters/'+id+'/'+Date.now()+'_'+name, r=st.ref(s,path);
        await st.uploadBytes(r,file,{contentType:file.type||'image/png'});
        return {where:'storage',path,url:await st.getDownloadURL(r),name,mime:file.type,size:file.size};
      }catch(e){ console.error(e); toast('Full-size original kept on this device only (Firebase Storage is not switched on)'); }
    }
    try{ await idb.put(id,file); return {where:'idb',name,mime:file.type,size:file.size}; }
    catch(e){ console.error(e); toast('Original could not be kept on this device'); return null; }
  },
  async getOriginal(p){
    const h=p&&p.hi; if(!h) return null;
    try{
      if(h.where==='idb') return await idb.get(p.id);
      if(h.where==='storage'){ const r=await fetch(h.url); if(!r.ok) throw new Error(r.status); return await r.blob(); }
    }catch(e){ console.error(e); }
    return null;
  },
  async dropOriginal(h){
    try{
      if(h.where==='idb') await idb.del(h.id||'');
      if(h.where==='storage' && this.fb){ const st=await import(this.fb.base+'firebase-storage.js'); await st.deleteObject(st.ref(st.getStorage(this.fb.app),h.path)); }
    }catch(e){ console.warn(e); }
  }
};
/* originals kept on this device when Firebase Storage is not set up */
const idb={
  _db:null,
  open(){ return this._db||(this._db=new Promise((res,rej)=>{ const r=indexedDB.open('wl_posters_hi',1); r.onupgradeneeded=()=>r.result.createObjectStore('f'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); })); },
  async tx(m,fn){ const db=await this.open(); return new Promise((res,rej)=>{ const t=db.transaction('f',m), rq=fn(t.objectStore('f')); t.oncomplete=()=>res(rq&&rq.result); t.onerror=()=>rej(t.error); }); },
  put(id,b){ return this.tx('readwrite',s=>s.put(b,id)); },
  get(id){ return this.tx('readonly',s=>s.get(id)); },
  del(id){ return this.tx('readwrite',s=>s.delete(id)); }
};

/* ---------- images ---------- */
const loadImg=src=>new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; });
const readFile=f=>new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(f); });
const MAX_CHARS=900000;   // keeps each poster under Firestore's 1 MiB document limit
async function prepImage(file){
  const raw=await readFile(file), img=await loadImg(raw);
  const big=Math.max(img.width,img.height);
  if(file.type==='image/png' && raw.length<MAX_CHARS && big<=1800) return raw;     // keep sharp small PNGs untouched
  let scale=Math.min(1,1800/big);
  for(let attempt=0;attempt<8;attempt++){
    const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(img.width*scale)); c.height=Math.max(1,Math.round(img.height*scale));
    const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    for(const qv of [.9,.8,.7,.6]){ const d=c.toDataURL('image/jpeg',qv); if(d.length<MAX_CHARS) return d; }
    scale*=.8;
  }
  throw new Error('too big');
}
async function pngBlob(src){
  const img=await loadImg(src), c=document.createElement('canvas'); c.width=img.width; c.height=img.height;
  c.getContext('2d').drawImage(img,0,0); return new Promise(r=>c.toBlob(r,'image/png'));
}
const slug=s=>(String(s||'poster').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'poster');

/* ---------- actions ---------- */
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }
  catch(e){ try{ const a=document.createElement('textarea'); a.value=t; a.style.position='fixed'; a.style.opacity='0'; document.body.appendChild(a); a.select(); const ok=document.execCommand('copy'); a.remove(); return ok; }catch(e2){ return false; } }
}
async function actCopyMsg(p){ if(!p.message){ toast('This poster has no message yet'); return false; } const ok=await copyText(p.message); toast(ok?'Message copied – paste it into WhatsApp':'Could not copy – select the text and copy it'); return ok; }
async function srcFor(p){ const b=await store.getOriginal(p); return b?URL.createObjectURL(b):p.img; }   // original if we have it, else the preview
async function actCopyImg(p){
  try{
    await navigator.clipboard.write([new ClipboardItem({'image/png':srcFor(p).then(pngBlob)})]);
    toast('Image copied – paste it into WhatsApp'); return true;
  }catch(e){ console.error(e); toast('Your browser would not copy the image – use Download instead'); return false; }
}
async function actDownload(p){
  const b=await store.getOriginal(p), a=document.createElement('a');
  let ext=/^data:image\/png/.test(p.img)?'png':'jpg';
  if(b){ const m=(b.type||p.hi.mime||'').split('/')[1]; ext=({jpeg:'jpg','svg+xml':'svg'}[m])||m||ext; a.href=URL.createObjectURL(b); }
  else if(p.hi&&p.hi.url){ window.open(p.hi.url,'_blank','noopener,noreferrer'); return toast('Opening the original in a new tab'); }
  else a.href=p.img;
  a.download=slug(p.title)+'.'+ext; document.body.appendChild(a); a.click(); a.remove(); toast('Downloading '+a.download);
  if(b) setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function flashTick(el){ if(!el||el._tk) return; el._tk=1; const h=el.innerHTML; el.classList.add('tkok'); el.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'; setTimeout(()=>{ el.innerHTML=h; el.classList.remove('tkok'); el._tk=0; },2200); }
/* ---------- render ---------- */
const sorted=()=>Object.values(posters).sort((a,b)=>(b.created||0)-(a.created||0));
function render(){
  $('#sync').textContent=store.mode==='firebase'?'● Synced':'Local only — add Firebase to share';
  $('#sync').className='pill'+(store.mode==='firebase'?' ok':'');
  const all=sorted(), norm=t=>(t||'').trim().toLowerCase();
  const tmap=new Map(); all.forEach(p=>{const k=norm(p.tag); if(k&&!tmap.has(k)) tmap.set(k,(p.tag||'').trim());});
  const tags=[...tmap.entries()].sort((a,b)=>a[1].localeCompare(b[1]));
  const cnt=k=>all.filter(p=>norm(p.tag)===k).length;
  if(tagF && !tmap.has(tagF)) tagF='';
  const PAL=['var(--accent)','#2563EB','#0891B2','#C026D3','#EA580C','#15803D','#B91C1C','#475569'];
  const TAGIC='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4l-7.2 7.2a2 2 0 01-2.8 0L3 13V3h10l7.6 7.6a2 2 0 010 2.8z"/><circle cx="7.5" cy="7.5" r="1.2"/></svg>';
  const trow=(lab,key,n)=>`<div class="sb-row${tagF===key?' on':''}" data-tag="${esc(key)}"><span class="sb-ic">${TAGIC}</span><span class="sb-lb">${esc(lab)}</span><b class="sb-n">${n}</b></div>`;
  const sc=$('#stats'); if(sc) sc.innerHTML=trow('All posters','',all.length)+tags.map(([k,tx])=>trow(tx,k,cnt(k))).join('');
  $('#rbar').innerHTML='<b style="font-size:13px;letter-spacing:.14em;margin-right:6px">POSTERS</b>'+(tagF?`<button class="bt3 clr" data-clear="1">Clear filter</button>`:'');
  const needle=q.trim().toLowerCase();
  const list=all.filter(p=>(!tagF||norm(p.tag)===tagF) && (!needle||((p.title||'')+' '+(p.tag||'')+' '+(p.message||'')).toLowerCase().includes(needle)));
  $('#grid').innerHTML=list.length?list.map(card).join(''):
    all.length?`<div class="empty"><b>No posters match</b>Try a different search or tag.</div>`:
    `<div class="empty"><svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><b>No posters yet</b>Add your first poster with the message that goes with it.<br><br><button class="btn pri" data-new="1">＋ NEW POSTER</button></div>`;
}
function card(p){
  return `<article class="pc" data-id="${p.id}">
    <div class="ph"><div class="pt"><h3>${esc(p.title)}</h3></div></div>
    <button class="pimg" data-view="${p.id}" title="View bigger"><img src="${p.img}" alt="${esc(p.title)}" loading="lazy">${p.tag?`<span class="tag ptag">${esc(p.tag)}</span>`:''}</button>
    <button class="btn pedit" data-edit="${p.id}" title="Edit this poster"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></button>

async function setFile(file){

}
async function save(){
  const title=$('#fTitle').value.trim(); if(!title){ $('#fTitle').focus(); return toast('Give the poster a title'); }

  const p={ id:draft.id, title, tag:$('#fTag').value.trim(), message:$('#fMsg').value.replace(/\s+$/,''), img:draft.img,
            by:isNew?me():(draft.by||me()), created:draft.created||now, updated:now, editedBy:me() };
  if(old) p.hi=old;
  posters[p.id]=p; pend[p.id]=p; close(); render(); toast(isNew?'Poster added':'Poster saved');
  const ok=await store.save(p);              // save the poster FIRST so a refresh can never lose it
  if(ok) delete pend[p.id];
  if(file){                                  // then keep the full-size original in the background
    const hi=await store.putOriginal(p.id,file);
    if(old) store.dropOriginal({...old,id:p.id});
    if(hi){ p.hi=hi; if(posters[p.id]) posters[p.id].hi=hi; await store.save(p); } else if(p.hi){ delete p.hi; await store.save(p); }
  }
}
async function del(){
  const p=posters[draft.id]; if(!p) return;

}

<script>/*m-ctl*/(function(){
function ready(f){if(document.body)f();else document.addEventListener('DOMContentLoaded',f)}
ready(function(){
var d=document,root=d.documentElement,rail=d.getElementById('wlRail');
var MOON='<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',SUN='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>';
var DOTS='<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>';
if(!d.getElementById('wlSunG')){var gd=d.createElement('div');gd.style.cssText='position:absolute;width:0;height:0;overflow:hidden';gd.innerHTML='<svg width="0" height="0" aria-hidden="true"><defs><linearGradient id="wlSunG" gradientUnits="userSpaceOnUse" x1="3" y1="3" x2="21" y2="21"><stop offset="0" stop-color="#FDE047"/><stop offset="1" stop-color="#F97316"/></linearGradient><linearGradient id="wlMoonG" gradientUnits="userSpaceOnUse" x1="4" y1="3" x2="20" y2="21"><stop offset="0" stop-color="#F1F5F9"/><stop offset="1" stop-color="#8FA3E8"/></linearGradient></defs></svg>';d.body.appendChild(gd)}
var c=d.createElement('div');c.className='mctl';
c.innerHTML='<button type="button" id="mcT" aria-label="Switch light or dark mode"></button>'+(rail?'<button type="button" id="mcM" aria-label="More">'+DOTS+'</button><div class="mmenu" id="mmenu"><button type="button" id="mmMute"></button><button type="button" id="mmDemo"></button></div>':'');
var top=d.querySelector('.top');if(top&&d.getElementById('so')){c.classList.add('inflow');top.insertBefore(c,d.getElementById('so'))}else d.body.appendChild(c);
function dark(){return root.dataset.theme==='dark'}
function paint(){var t=d.getElementById('mcT');if(t)t.innerHTML=dark()?SUN:MOON;
 if(rail){var mu=d.getElementById('wlMute'),de=d.getElementById('wlDemo');var muted=mu&&mu.classList.contains('muted');
  var mm=d.getElementById('mmMute');mm.className=muted?'red':'';mm.innerHTML=(muted?'<svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4zM22 9l-6 6M16 9l6 6"/></svg>Unmute':'<svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4zM19 5a9 9 0 0 1 0 14M15.5 8.5a5 5 0 0 1 0 7"/></svg>Mute');
  var on=de&&de.classList.contains('demoon');d.getElementById('mmDemo').innerHTML='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M10 8l6 4-6 4z"/></svg>'+(on?'Exit demo':'Demo mode')}}
d.getElementById('mcT').onclick=function(){var th=rail&&d.getElementById('wlTheme');if(th){th.click()}else{var n=dark()?'light':'dark';root.dataset.theme=n;try{localStorage.setItem('wl_theme',n)}catch(e){}}setTimeout(paint,50)};
if(rail){var menu=d.getElementById('mmenu');
 d.getElementById('mcM').onclick=function(e){e.stopPropagation();paint();menu.classList.toggle('open')};
 d.addEventListener('click',function(e){if(!e.target.closest('.mctl'))menu.classList.remove('open')});
 d.getElementById('mmMute').onclick=function(){d.getElementById('wlMute').click();setTimeout(paint,50)};
 d.getElementById('mmDemo').onclick=function(){d.getElementById('wlDemo').click()}}
new MutationObserver(paint).observe(root,{attributes:true,attributeFilter:['data-theme']});paint();
})})();</script>
